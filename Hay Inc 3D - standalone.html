// Procedural low-poly character rig + walk cycle
function makeRig(T, opt = {}) {
  const c = Object.assign({ skin: '#F1C29A', shirt: '#E8483B', pants: '#3E63B8', shoe: '#5B3A24', hat: '#F2C14E', band: '#C0392B', hair: '#6B4226', hatOn: true, pack: false, s: 1 }, opt);
  const cache = {};
  const m = col => cache[col] || (cache[col] = new T.MeshStandardMaterial({ color: col, roughness: 0.75 }));
  const part = (geo, col, parent, x = 0, y = 0, z = 0) => { const me = new T.Mesh(geo, m(col)); me.position.set(x, y, z); me.castShadow = true; me.receiveShadow = true; parent.add(me); return me; };
  const grp = (parent, x = 0, y = 0, z = 0) => { const g = new T.Group(); g.position.set(x, y, z); parent.add(g); return g; };
  const cap = (r, l) => new T.CapsuleGeometry(r, l, 4, 10);
  const root = new T.Group();
  const body = grp(root); body.scale.setScalar(c.s);
  const hips = grp(body, 0, 0.9, 0);
  part(new T.BoxGeometry(0.44, 0.24, 0.28), c.pants, hips, 0, 0.02, 0);
  const torso = grp(hips, 0, 0.1, 0);
  part(cap(0.23, 0.3), c.shirt, torso, 0, 0.3, 0).scale.set(1, 1, 0.8);
  part(new T.BoxGeometry(0.3, 0.24, 0.04), c.pants, torso, 0, 0.18, 0.17);
  part(new T.BoxGeometry(0.06, 0.34, 0.03), c.pants, torso, 0.11, 0.38, 0.18);
  part(new T.BoxGeometry(0.06, 0.34, 0.03), c.pants, torso, -0.11, 0.38, 0.18);
  if (c.pack) {
    part(new T.BoxGeometry(0.42, 0.5, 0.08), '#9C6B3C', torso, 0, 0.36, -0.22);
    part(new T.BoxGeometry(0.5, 0.06, 0.34), '#7E5330', torso, 0, 0.1, -0.33);
  }
  const neck = grp(torso, 0, 0.6, 0);
  const head = grp(neck, 0, 0.2, 0);
  part(new T.SphereGeometry(0.23, 20, 16), c.skin, head);
  part(new T.SphereGeometry(0.235, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), c.hair, head, 0, 0.01, -0.015).rotation.x = -0.25;
  part(new T.SphereGeometry(0.05, 8, 6), '#E0A07A', head, 0, -0.02, 0.22);
  part(new T.SphereGeometry(0.033, 8, 6), '#2A2344', head, 0.085, 0.05, 0.2);
  part(new T.SphereGeometry(0.033, 8, 6), '#2A2344', head, -0.085, 0.05, 0.2);
  part(new T.SphereGeometry(0.05, 8, 6), c.skin, head, 0.22, 0, 0);
  part(new T.SphereGeometry(0.05, 8, 6), c.skin, head, -0.22, 0, 0);
  if (c.hatOn) {
    part(new T.CylinderGeometry(0.4, 0.42, 0.035, 28), c.hat, head, 0, 0.13, 0);
    part(new T.CylinderGeometry(0.2, 0.235, 0.18, 22), c.hat, head, 0, 0.23, 0);
    part(new T.CylinderGeometry(0.238, 0.238, 0.05, 22), c.band, head, 0, 0.17, 0);
  }
  const mkArm = side => {
    const sh = grp(torso, side * 0.29, 0.5, 0);
    part(cap(0.075, 0.22), c.shirt, sh, 0, -0.14, 0);
    const el = grp(sh, 0, -0.3, 0);
    part(cap(0.065, 0.18), c.skin, el, 0, -0.12, 0);
    part(new T.SphereGeometry(0.078, 10, 8), c.skin, el, 0, -0.27, 0);
    return [sh, el];
  };
  const mkLeg = side => {
    const hp = grp(hips, side * 0.12, -0.05, 0);
    part(cap(0.095, 0.24), c.pants, hp, 0, -0.18, 0);
    const kn = grp(hp, 0, -0.4, 0);
    part(cap(0.085, 0.22), c.pants, kn, 0, -0.16, 0);
    const ft = grp(kn, 0, -0.38, 0);
    part(new T.BoxGeometry(0.16, 0.1, 0.28), c.shoe, ft, 0, -0.02, 0.05);
    return [hp, kn, ft];
  };
  const [armL, elL] = mkArm(-1), [armR, elR] = mkArm(1);
  const [legL, kneeL, footL] = mkLeg(-1), [legR, kneeR, footR] = mkLeg(1);
  return { root, body, hips, torso, head, armL, armR, elL, elR, legL, legR, kneeL, kneeR, footL, footR, phase: 0, w: 0, lastS: 1 };
}

// speed in units/s; ref = run speed. Returns true on a footfall.
function animateRig(r, dt, speed, t, ref = 5) {
  const k = Math.min(1, speed / ref);
  r.w += ((speed > 0.3 ? 1 : 0) - r.w) * (1 - Math.exp(-dt * 10));
  const w = r.w;
  r.phase += dt * (3 + speed * 1.7);
  const s = Math.sin(r.phase), c = Math.cos(r.phase);
  const A = (0.5 + 0.35 * k) * w, knee = 1.15 * (0.6 + 0.4 * k) * w;
  r.legL.rotation.x = -s * A; r.legR.rotation.x = s * A;
  r.kneeL.rotation.x = w * 0.08 + Math.max(0, c) * knee;
  r.kneeR.rotation.x = w * 0.08 + Math.max(0, -c) * knee;
  r.footL.rotation.x = -(r.legL.rotation.x + r.kneeL.rotation.x) * 0.75 + Math.max(0, -s) * 0.25 * w;
  r.footR.rotation.x = -(r.legR.rotation.x + r.kneeR.rotation.x) * 0.75 + Math.max(0, s) * 0.25 * w;
  const idle = (1 - w) * Math.sin(t * 1.8) * 0.04;
  r.armL.rotation.x = s * (0.75 * w) + idle; r.armR.rotation.x = -s * (0.75 * w) - idle;
  r.armL.rotation.z = -0.1 - (1 - w) * 0.02; r.armR.rotation.z = 0.1 + (1 - w) * 0.02;
  r.elL.rotation.x = -0.2 - w * (0.5 + Math.max(0, -s) * 0.4);
  r.elR.rotation.x = -0.2 - w * (0.5 + Math.max(0, s) * 0.4);
  r.body.position.y = w * (0.055 * Math.cos(2 * r.phase) - 0.025);
  r.hips.rotation.y = s * 0.14 * w;
  r.hips.rotation.z = c * 0.045 * w;
  r.torso.rotation.y = -s * 0.24 * w;
  r.torso.rotation.x = w * (0.06 + 0.12 * k);
  r.torso.scale.y = 1 + (1 - w) * Math.sin(t * 2.4) * 0.015;
  r.head.rotation.y = s * 0.1 * w;
  r.head.rotation.x = -r.torso.rotation.x * 0.6;
  const sg = s > 0 ? 1 : -1, step = sg !== r.lastS && w > 0.5;
  r.lastS = sg;
  return step;
}

// Farm world builder: terrain, buildings, props, gameplay stations
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function merge(T, list) {
  const pos = [], nor = [], col = [];
  for (const { g, c } of list) {
    const n = g.index ? g.toNonIndexed() : g;
    const p = n.attributes.position.array, q = n.attributes.normal.array;
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(q[i]); }
    for (let i = 0; i < p.length / 3; i++) { const cc = typeof c === 'function' ? c(p[i * 3 + 1]) : (c || { r: 1, g: 1, b: 1 }); col.push(cc.r, cc.g, cc.b); }
  }
  const G = new T.BufferGeometry();
  G.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  G.setAttribute('normal', new T.Float32BufferAttribute(nor, 3));
  G.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  return G;
}

function buildWorld(T, scene, IMG, L) {
  const R = mulberry(20260926);
  const cols = [], avoid = [];
  const mc = {};
  const M = (c, o) => { const k = c + JSON.stringify(o || 0); return mc[k] || (mc[k] = new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85 }, o || {}))); };
  const mat = m => typeof m === 'string' ? M(m) : m;
  const add = (geo, m, x = 0, y = 0, z = 0, p = scene, cast = true) => { const me = new T.Mesh(geo, mat(m)); me.position.set(x, y, z); me.castShadow = cast; me.receiveShadow = true; p.add(me); return me; };
  const box = (w, h, d, m, x, y, z, p) => add(new T.BoxGeometry(w, h, d), m, x, y, z, p);
  const cyl = (rt, rb, h, seg, m, x, y, z, p) => add(new T.CylinderGeometry(rt, rb, h, seg), m, x, y, z, p);
  const grp = (x = 0, y = 0, z = 0, ry = 0, p = scene) => { const g = new T.Group(); g.position.set(x, y, z); g.rotation.y = ry; p.add(g); return g; };
  const tex = (w, h, fn, rx = 1, ry = 1) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t; };
  const speck = (x, w, h, n, colors, len = 4, lw = 1.5, horiz) => { for (let i = 0; i < n; i++) { x.strokeStyle = colors[i % colors.length]; x.lineWidth = lw; const px = R() * w, py = R() * h, a = (horiz ? 0 : -Math.PI / 2) + (R() - 0.5) * 1.2, l = len * (0.5 + R()); x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); } };
  const free = (x, z, pad = 0) => !avoid.some(a => x > a.x0 - pad && x < a.x1 + pad && z > a.z0 - pad && z < a.z1 + pad);
  const colBox = (x0, x1, z0, z1, id) => { const c = { t: 'b', x0, x1, z0, z1, id }; cols.push(c); avoid.push({ x0, x1, z0, z1 }); return c; };
  const colC = (x, z, r) => { cols.push({ t: 'c', x, z, r }); avoid.push({ x0: x - r, x1: x + r, z0: z - r, z1: z + r }); };
  const B = L.BOUNDS;
  const inB = (x, z) => x > B.x0 && x < B.x1 && z > B.z0 && z < B.z1;

  // ---------- ground ----------
  const gTex = tex(256, 256, (x, w, h) => { x.fillStyle = '#eef5e4'; x.fillRect(0, 0, w, h); speck(x, w, h, 1100, ['rgba(40,90,20,.22)', 'rgba(255,255,255,.4)', 'rgba(70,120,30,.2)'], 6, 1.6); }, 55, 55);
  const gg = new T.PlaneGeometry(240, 240, 120, 120); gg.rotateX(-Math.PI / 2);
  const gp = gg.attributes.position, gc = [];
  const c1 = new T.Color('#62B23E'), c2 = new T.Color('#9ED45A'), c3 = new T.Color('#4A9433'), tc = new T.Color();
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), z = gp.getZ(i);
    const n = Math.sin(x * 0.09) + Math.sin(z * 0.075 + 1.3) + Math.sin((x + z) * 0.05) * 0.8 + Math.sin(x * 0.27 + z * 0.21) * 0.4;
    const k = (n + 3) / 6;
    tc.copy(c3).lerp(c1, Math.min(1, k * 1.7)).lerp(c2, Math.max(0, k - 0.52) * 1.5);
    const d = Math.max(Math.abs(x) - 46, -42 - z, z - 34);
    if (d > 0) gp.setY(i, d * 0.42 + Math.sin(x * 0.21) * Math.sin(z * 0.17) * Math.min(d, 8) * 0.35);
    gc.push(tc.r, tc.g, tc.b);
  }
  gg.setAttribute('color', new T.Float32BufferAttribute(gc, 3)); gg.computeVertexNormals();
  add(gg, new T.MeshStandardMaterial({ map: gTex, vertexColors: true, roughness: 1 }), 0, 0, 0, scene, false);

  const dirtDraw = (x, w, h, base = '#C8A26A') => { x.fillStyle = base; x.fillRect(0, 0, w, h); for (let i = 0; i < w * h / 90; i++) { x.fillStyle = ['rgba(120,85,45,.35)', 'rgba(240,215,160,.55)', 'rgba(150,110,60,.3)'][i % 3]; x.beginPath(); x.arc(R() * w, R() * h, 0.6 + R() * 2.2, 0, 7); x.fill(); } };
  const dirtMat = t => new T.MeshStandardMaterial({ map: t, transparent: true, depthWrite: false, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const pathTex = tex(256, 128, (x, w, h) => { dirtDraw(x, w, h); x.globalCompositeOperation = 'destination-in'; const gr = x.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.25, '#000'); gr.addColorStop(0.75, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h); });
  const path = (x1, z1, x2, z2, w) => { const len = Math.hypot(x2 - x1, z2 - z1); const t = pathTex.clone(); t.needsUpdate = true; t.repeat.set(len / 5, 1); t.wrapT = T.ClampToEdgeWrapping; const m = add(new T.PlaneGeometry(len + w * 0.6, w).rotateX(-Math.PI / 2), dirtMat(t), (x1 + x2) / 2, 0.02, (z1 + z2) / 2, scene, false); m.rotation.y = -Math.atan2(z2 - z1, x2 - x1); m.renderOrder = 1; };
  const yardTex = tex(512, 512, (x, w, h) => { dirtDraw(x, w, h, '#D4B57E'); x.globalCompositeOperation = 'destination-in'; const gr = x.createRadialGradient(w / 2, h / 2, w * 0.28, w / 2, h / 2, w / 2); gr.addColorStop(0, '#000'); gr.addColorStop(0.7, 'rgba(0,0,0,.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h); });
  yardTex.wrapS = yardTex.wrapT = T.ClampToEdgeWrapping;
  const yard = add(new T.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), dirtMat(yardTex), 1.5, 0.015, -0.5, scene, false); yard.scale.set(32, 1, 30); yard.renderOrder = 1;
  path(-90, 16.5, 90, 16.5, 3.6); path(11.5, 16, 11.5, 10, 2.2); path(-13, -4.5, -20, -5.5, 2.4); path(12, -8, 18, -12.5, 2); path(14.5, 0, 17, -3, 1.6);
  avoid.push({ x0: -16, x1: 15, z0: -12, z1: 13 }, { x0: -95, x1: 95, z0: 14.3, z1: 18.7 }, { x0: 10, x1: 13, z0: 9, z1: 16 });

  // ---------- field beds ----------
  const soilTex = tex(64, 64, (x, w, h) => { x.fillStyle = '#7B5331'; x.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 32) { x.fillStyle = '#5A3B22'; x.fillRect(0, y + 22, w, 7); x.fillStyle = '#946842'; x.fillRect(0, y + 4, w, 7); } for (let i = 0; i < 160; i++) { x.fillStyle = R() < 0.5 ? 'rgba(40,25,10,.35)' : 'rgba(170,130,80,.35)'; x.fillRect(R() * w, R() * h, 2, 2); } });
  const wood = M('#B07A45'), woodD = M('#8A5A31'), woodL = M('#D6A66A');
  const bed = F => { const w = F.cols + 0.6, d = F.rows + 0.6; const t = soilTex.clone(); t.needsUpdate = true; t.repeat.set(w / 2, d / 2); add(new T.BoxGeometry(w, 0.14, d), new T.MeshStandardMaterial({ map: t, roughness: 1 }), F.cx, 0.07, F.cz, scene, false); box(w + 0.3, 0.24, 0.16, wood, F.cx, 0.12, F.cz - d / 2 - 0.08); box(w + 0.3, 0.24, 0.16, wood, F.cx, 0.12, F.cz + d / 2 + 0.08); box(0.16, 0.24, d, wood, F.cx - w / 2 - 0.08, 0.12, F.cz); box(0.16, 0.24, d, wood, F.cx + w / 2 + 0.08, 0.12, F.cz); };
  bed(L.A); bed(L.B);

  // ---------- item meshes ----------
  const strawTex = tex(128, 80, (x, w, h) => { x.fillStyle = '#E8BF55'; x.fillRect(0, 0, w, h); speck(x, w, h, 600, ['#C9952E', '#F8DE8C', '#D9AA40'], 7, 1.4, true); x.fillStyle = '#8E5B2A'; x.fillRect(w * 0.26, 0, 5, h); x.fillRect(w * 0.7, 0, 5, h); });
  const packTex = tex(128, 128, (x, w, h) => { x.fillStyle = '#F2CF62'; x.fillRect(0, 0, w, h); speck(x, w, h, 500, ['#D9A83A', '#FFF0A8'], 6, 1.3, true); x.fillStyle = '#6D3FE0'; x.fillRect(w / 2 - 9, 0, 18, h); x.fillRect(0, h / 2 - 9, w, 18); x.fillStyle = '#fff'; x.beginPath(); x.arc(w / 2, h / 2, 17, 0, 7); x.fill(); x.fillStyle = '#6D3FE0'; x.font = '900 22px Rubik'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('ח', w / 2, h / 2 + 1); });
  const coinTex = tex(128, 128, (x, w, h) => { x.fillStyle = '#F5B82A'; x.fillRect(0, 0, w, h); x.fillStyle = '#FFD65A'; x.beginPath(); x.arc(64, 64, 52, 0, 7); x.fill(); x.strokeStyle = '#D9901A'; x.lineWidth = 6; x.beginPath(); x.arc(64, 64, 44, 0, 7); x.stroke(); x.fillStyle = '#C97F10'; x.font = '900 54px Rubik'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('₪', 64, 68); });
  [strawTex, packTex, coinTex].forEach(t => t.wrapS = t.wrapT = T.ClampToEdgeWrapping);
  const gold = M('#EFA91C', { metalness: 0.45, roughness: 0.35 });
  const items = {
    hay: { geo: new T.BoxGeometry(0.66, 0.36, 0.46), mat: new T.MeshStandardMaterial({ map: strawTex, roughness: 0.95 }), h: 0.36, sx: 0.68, sz: 0.48 },
    box: { geo: new T.BoxGeometry(0.56, 0.42, 0.56), mat: new T.MeshStandardMaterial({ map: packTex, roughness: 0.85 }), h: 0.42, sx: 0.6, sz: 0.6 },
    coin: { geo: new T.CylinderGeometry(0.2, 0.2, 0.07, 22), mat: [gold, new T.MeshStandardMaterial({ map: coinTex, metalness: 0.35, roughness: 0.4 }), gold], h: 0.075, sx: 0.44, sz: 0.44 }
  };

  // hay tuft
  const tuft = (() => { const r = mulberry(3), list = []; for (let i = 0; i < 16; i++) { const h = 0.5 + r() * 0.4; const g = new T.ConeGeometry(0.055, h, 3); g.translate(0, h / 2, 0); g.rotateZ((r() - 0.5) * 0.8); g.rotateX((r() - 0.5) * 0.8); g.translate((r() - 0.5) * 0.55, 0, (r() - 0.5) * 0.55); list.push({ g, c: y => { const k = 0.45 + 0.55 * Math.min(1, y / 0.8); return { r: k, g: k, b: k }; } }); } for (let i = 0; i < 6; i++) { const g = new T.SphereGeometry(0.065, 5, 4); g.scale(1, 2, 1); g.translate((r() - 0.5) * 0.45, 0.72 + r() * 0.18, (r() - 0.5) * 0.45); list.push({ g, c: { r: 1.1, g: 1.02, b: 0.8 } }); } return merge(T, list); })();

  // ---------- rounded pads ----------
  const rrShape = (w, d, r) => { const s = new T.Shape(), x = -w / 2, y = -d / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d); s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; };
  const padTop = (bg, dash, icon, alpha = 1) => (x, w, h) => { x.clearRect(0, 0, w, h); x.fillStyle = bg; x.beginPath(); x.roundRect(4, 4, w - 8, h - 8, 34); x.fill(); x.setLineDash([22, 16]); x.lineWidth = 9; x.strokeStyle = dash; x.beginPath(); x.roundRect(24, 24, w - 48, h - 48, 22); x.stroke(); x.setLineDash([]); const im = IMG[icon]; if (im && im.naturalWidth) { x.globalAlpha = alpha; const s = Math.min(w, h) * 0.5, ih = s * im.naturalHeight / im.naturalWidth; x.drawImage(im, w / 2 - s / 2, h / 2 - ih / 2, s, ih); x.globalAlpha = 1; } };
  const pad = (x, z, w, d, base, draw) => {

    const topMat = new T.MeshStandardMaterial({ map: t, transparent: true, roughness: 0.6, emissive: '#ffffff', emissiveIntensity: 0 });
    add(new T.PlaneGeometry(w - 0.08, d - 0.08).rotateX(-Math.PI / 2), topMat, 0, 0.125, 0, g, false);
    const fill = add(new T.PlaneGeometry(w - 0.34, d - 0.34).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.4, depthWrite: false }), 0, 0.13, 0, g, false);

  };
  const floor = {
    input: pad(L.INPUT.x, L.INPUT.z, L.INPUT.w, L.INPUT.d, '#CDB88F', padTop('#FFF8EC', '#9BC87A', 'hay-block', 0.3)),
    tray: pad(L.TRAY.x, L.TRAY.z, L.TRAY.w, L.TRAY.d, '#CDB88F', padTop('#FFF8EC', '#B9A6F0', 'product-box', 0.3)),
    drop: pad(L.DROP.x, L.DROP.z, L.DROP.w, L.DROP.d, '#CDB88F', padTop('#FFF8EC', '#B9A6F0', 'product-box', 0.3))
  };
  const pads = {};
  for (const P of L.PADS) { const gold = P.id === 'expand'; pads[P.id] = pad(P.x, P.z, P.w || 1.9, P.d || 1.9, gold ? '#C98500' : '#4E28B0', padTop(gold ? '#FFC61A' : '#8B5CF6', 'rgba(255,255,255,.85)', P.icon)); }

  // ---------- baler machine ----------
  const machine = (() => {
    const g = grp(L.MACH.x, 0, L.MACH.z), body = grp(0, 0, 0, 0, g);
    const red = M('#E2483A', { roughness: 0.5, metalness: 0.15 }), dark = M('#3A3F4A', { roughness: 0.55, metalness: 0.35 }), yel = M('#F2B233', { roughness: 0.5 });
    box(4.2, 0.3, 2.8, dark, 0, 0.15, 0, body);
    box(3.4, 1.9, 2.3, red, 0, 1.25, 0, body);
    box(3.55, 0.18, 2.45, dark, 0, 2.25, 0, body);
    const stripeMat = new T.MeshStandardMaterial({ color: '#B9BEC8', metalness: 0.4, roughness: 0.4 });
    box(3.42, 0.3, 2.32, stripeMat, 0, 0.62, 0, body);
    const hp = cyl(1.2, 0.5, 1.2, 4, yel, -0.75, 3.0, 0, body); hp.rotation.y = Math.PI / 4;
    cyl(1.25, 1.25, 0.1, 4, dark, -0.75, 3.62, 0, body).rotation.y = Math.PI / 4;
    cyl(0.16, 0.2, 1.5, 12, dark, 1.05, 3.0, -0.55, body); cyl(0.27, 0.27, 0.12, 12, dark, 1.05, 3.78, -0.55, body);
    const ch2 = cyl(0.13, 0.16, 1.1, 12, dark, 1.5, 2.8, -0.55, body);

    box(1.0, 0.7, 0.1, M('#1E2229'), 1.3, 0.95, 1.16, body);
    const beltTex = tex(64, 64, (x, w, h) => { x.fillStyle = '#2E323A'; x.fillRect(0, 0, w, h); x.fillStyle = '#4A505C'; for (let y = 0; y < h; y += 16) x.fillRect(0, y, w, 6); }, 1, 2);
    const chute = add(new T.BoxGeometry(0.95, 0.08, 1.5), new T.MeshStandardMaterial({ map: beltTex, roughness: 0.7 }), 1.3, 0.55, 1.9, body); chute.rotation.x = 0.35;
    box(0.06, 0.2, 1.5, dark, 1.8, 0.62, 1.9, body).rotation.x = 0.35; box(0.06, 0.2, 1.5, dark, 0.8, 0.62, 1.9, body).rotation.x = 0.35;
    const fw = grp(2.1, 1.3, -0.2, 0, body);
    cyl(0.75, 0.75, 0.14, 26, dark, 0, 0, 0, fw).rotation.z = Math.PI / 2;
    for (let i = 0; i < 3; i++) { const sp = box(0.16, 1.3, 0.12, yel, 0.02, 0, 0, fw); sp.rotation.x = i * Math.PI / 3; }
    colBox(L.MACH.x - 2.25, L.MACH.x + 2.4, L.MACH.z - 1.5, L.MACH.z + 1.4);
    const setLevel = lv => { stripeMat.color.set(['#B9BEC8', '#3B82F6', '#F2B01E'][lv]); ch2.visible = lv >= 1; body.userData.base = 1 + lv * 0.07; body.scale.setScalar(body.userData.base); };
    return { g, body, fw, beltTex, setLevel, smoke: new T.Vector3(L.MACH.x + 1.05, 3.95, L.MACH.z - 0.55) };
  })();

  // ---------- market stall ----------
  (() => {
    const g = grp(L.STALL.x, 0, L.STALL.z);
    box(1.3, 1.05, 3.6, wood, 0, 0.525, 0, g); box(1.55, 0.1, 3.85, woodL, 0, 1.1, 0, g);
    for (let i = -1; i <= 1; i++) box(1.32, 0.06, 0.08, woodD, 0, 0.6, i * 1.1, g);
    for (const sx of [-0.72, 0.72]) for (const sz of [-1.85, 1.85]) box(0.14, 2.9, 0.14, woodD, sx, 1.45, sz, g);
    const aw = tex(128, 32, (x, w, h) => { for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#FFFFFF' : '#E8483B'; x.fillRect(i * 16, 0, 16, h); } }, 1, 1);
    const awM = new T.MeshStandardMaterial({ map: aw, roughness: 0.8 });

    add(new T.BoxGeometry(0.04, 0.32, 4.3), awM, 1.14, 2.74, 0, g); add(new T.BoxGeometry(0.04, 0.32, 4.3), awM, -1.14, 3.0, 0, g);
    const st = tex(256, 80, (x, w, h) => { x.fillStyle = '#2F7A24'; x.beginPath(); x.roundRect(0, 0, w, h, 18); x.fill(); x.strokeStyle = '#FFE08A'; x.lineWidth = 6; x.beginPath(); x.roundRect(6, 6, w - 12, h - 12, 14); x.stroke(); x.fillStyle = '#fff'; x.font = '900 44px Rubik'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.direction = 'rtl'; x.fillText('שוק החציר', w / 2, h / 2 + 3); });
    st.wrapS = st.wrapT = T.ClampToEdgeWrapping;
    const s = add(new T.PlaneGeometry(2.4, 0.75), new T.MeshStandardMaterial({ map: st, transparent: true, roughness: 0.7 }), 0, 3.55, 2.0, g); s.rotation.x = -0.45;
    box(0.08, 0.6, 0.08, woodD, -0.8, 3.3, 2.0, g); box(0.08, 0.6, 0.08, woodD, 0.8, 3.3, 2.0, g);
    for (const [bx, bz] of [[0.1, -1.2], [0.1, -0.6], [0.1, -0.9]]) { const m = new T.Mesh(items.box.geo, items.box.mat); m.position.set(bx, 1.36 + (bz === -0.9 ? 0.42 : 0), bz); m.scale.setScalar(0.85); m.castShadow = true; g.add(m); }
    colBox(L.STALL.x - 0.85, L.STALL.x + 0.85, L.STALL.z - 2.0, L.STALL.z + 2.0);
  })();

  // ---------- fences ----------
  const fence = (x1, z1, x2, z2, p = scene, gap) => {
    const len = Math.hypot(x2 - x1, z2 - z1), n = Math.max(1, Math.round(len / 1.7)), ang = Math.atan2(z2 - z1, x2 - x1);
    for (let i = 0; i <= n; i++) { const t = i / n; box(0.16, 1.0, 0.16, woodD, x1 + (x2 - x1) * t, 0.5, z1 + (z2 - z1) * t, p); }
